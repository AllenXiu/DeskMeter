-- DeskMeter for macOS 示例配置（仅使用 macOS 采集器支持的数据源）
conky.config = {
    update_interval = 2,
    alignment = 'top_right',
    own_window = true,
    own_window_type = 'normal',
    own_window_transparent = true,
    font = 'Menlo:size=12',
    default_color = 'FFFFFF',
    color0 = '88CCFF',
    color1 = 'FF8888',
    gap_x = 16, gap_y = 16,
    minimum_width = 240,
};
deskmeter = {
    click_through = true,
    -- pinned=true: 桌面层（壁纸之上、应用窗口之下），不遮挡其它应用；
    -- 若你的 macOS 版本下不可见，改为 pinned=false 或加 --window-level overlay 浮动显示
    pinned = true,
    top = { sort = 'cpu', columns = { 'name', 'pid', 'cpu', 'mem' } },
};
conky.text = [[
${color0}${hostname}${color}  ${time %H:%M:%S}
$hr
${color grey}系统${color}  $sysname $kernel $machine
${color grey}运行${color}  $uptime  |  $processes 个进程  |  $running_processes 个运行
${color grey}CPU 单核${color}  ${cpu 1}%  ${cpu 2}%  ${cpu 3}%  ${cpu 4}%
${color grey}CPU${color}   $cpu%
${cpubar 4}
${color grey}内存${color}  $memperc%  $mem/$memmax
${membar 4}
${color grey}Swap${color}  $swapperc%
${swapbar 4}
${color grey}磁盘 /${color}  ${fs_used /}/${fs_size /}
${fs_bar 4 /}
${color grey}网络${color}  down $downspeed  up $upspeed
${if_up}${color grey}接口${color}  $iface up${else}${color grey}接口${color}  --${endif}
$hr
${top_header}
${color lightgrey}${top name 1}${top pid 1}${top cpu 1}${top mem 1}
${color lightgrey}${top name 2}${top pid 2}${top cpu 2}${top mem 2}
${color lightgrey}${top name 3}${top pid 3}${top cpu 3}${top mem 3}
${color lightgrey}${top name 4}${top pid 4}${top cpu 4}${top mem 4}
${color lightgrey}${top name 5}${top pid 5}${top cpu 5}${top mem 5}
${color lightgrey}${top name 6}${top pid 6}${top cpu 6}${top mem 6}
${color lightgrey}${top name 7}${top pid 7}${top cpu 7}${top mem 7}
${color lightgrey}${top name 8}${top pid 8}${top cpu 8}${top mem 8}
$hr
${color grey}主机 IP${color}  ${addr}
]];
