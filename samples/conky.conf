-- DeskMeter 示例配置（Conky 兼容语法，完整 Lua 由 MoonSharp 执行）
conky.config = {
    update_interval = 2,
    alignment = 'top_right',
    gap_x = 16,
    gap_y = 16,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    use_xft = true,
    font = 'Consolas:size=12',
    default_color = 'FFFFFF',
    color0 = '88CCFF',
    color1 = 'FF8888',
    color2 = '8AE28A',
    -- Conky 固定宽度技巧：minimum_width = maximum_width → 窗口宽度恒定，bar 填满整行不再抖动
    minimum_width = 260,
    maximum_width = 260,
};

conky.text = [[
$color0$hostname$color  ${time %H:%M}
$hr
CPU  $cpu%  ${cpubar 6}
内存  $memperc%  ${membar 6,120}
磁盘  ${fs_free_perc /}%  ${fs_bar 6 /}
网络  ↓ $downspeed  ↑ $upspeed
运行时间  $uptime
]];
