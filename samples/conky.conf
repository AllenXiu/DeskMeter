-- Configuration settings: https://conky.cc/config_settings
conky.config = {
    alignment = 'top_left',
    background = false,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = 'white',
    default_outline_color = 'white',
    default_shade_color = 'white',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'DejaVu Sans Mono:size=12',
    gap_x = 0,
    gap_y = 0,
    minimum_height = 5,
    minimum_width = 5,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_wayland = false,
    out_to_x = true,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'normal',
    own_window_hints = 'undecorated,sticky,below,skip_taskbar,skip_pager',
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    update_interval = 1,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
}

-- Variables: https://conky.cc/variables

-- Lua function example: call it from conky.text with ${lua welcome DeskMeter}
function welcome(name)
    return "Welcome, " .. name
end

-- Second drive example (change the drive letter if needed, e.g. E: or F:)
deskmeter = {
    monitor = 0,
    -- 关闭点击穿透才能点击 Top 表头切换排序（任务管理器式）；不需要时改回 true
    click_through = false,
    -- Top 进程表：排序键 cpu|mem|pid|name|disk|gpu|net；columns 决定表头与列
    top = {
        sort = 'cpu',
        columns = { 'name', 'pid', 'cpu', 'mem', 'disk', 'gpu', 'net' },
    },
};
conky.text = [[
${color grey}Info:$color ${scroll 32 Conky $conky_version - $sysname $nodename $kernel $machine}
$hr
${color grey}Uptime:$color $uptime
${color grey}Frequency (in MHz):$color $freq
${color grey}Frequency (in GHz):$color $freq_g
${color grey}RAM Usage:$color $mem/$memmax - $memperc% 
${membar 4}
${color grey}Swap Usage:$color $swap/$swapmax - $swapperc% 
${swapbar 4}
${color grey}CPU Usage:$color $cpu% 
${cpubar 4}
${color grey}CPU Temp  ${platform coretemp.0 temp 1}
${color grey}GPU Temp  ${platform radeon.0 temp 1}
${color grey}Processes:$color $processes  ${color grey}Running:$color $running_processes
$hr
${color grey}File systems:
$color${fs_used /}/${fs_size /} 
${fs_bar 6 /}
${color grey}D: (Data)$color ${fs_used D:}/${fs_size D:} 
${fs_bar 6 D:}
${color grey}Networking:
Up:$color ${upspeed} ${color grey}
Down:$color ${downspeed}
$hr
${color grey}Extensions (Conky vars / Windows substitutes):
${color grey}Network:$color IP $addr  GW $gw_ip  DNS $nameserver
${color grey}Loadavg (1/5/15min):$color $loadavg
${color grey}Disk IO:$color R $diskio_read  W $diskio_write
${diskiograph 20}
${color grey}Battery:$color $battery_percent%  $battery_status  $battery_time
${battery_bar 4}
${color grey}Text:$color ${uppercase ${hostname}}  ${startcase hello world}  ${to_bytes 2GiB}
${if_running explorer}${color grey}Explorer:$color running${else}${color grey}Explorer:$color not running${endif}
${if_match ${cpu} > 10}${color grey}CPU state:$color busy${else}${color grey}CPU state:$color idle${endif}
${if_up}${color grey}Network:$color up${else}${color grey}Network:$color down${endif}
${color grey}Lua:$color ${lua welcome DeskMeter}
$hr
${top_header}
${color lightgrey}${top name 1} ${top pid 1} ${top cpu 1} ${top mem 1} ${top disk 1} ${top gpu 1} ${top net 1}
${color lightgrey}${top name 2} ${top pid 2} ${top cpu 2} ${top mem 2} ${top disk 2} ${top gpu 2} ${top net 2}
${color lightgrey}${top name 3} ${top pid 3} ${top cpu 3} ${top mem 3} ${top disk 3} ${top gpu 3} ${top net 3}
${color lightgrey}${top name 4} ${top pid 4} ${top cpu 4} ${top mem 4} ${top disk 4} ${top gpu 4} ${top net 4}
${color lightgrey}${top name 5} ${top pid 5} ${top cpu 5} ${top mem 5} ${top disk 5} ${top gpu 5} ${top net 5}
${color lightgrey}${top name 6} ${top pid 6} ${top cpu 6} ${top mem 6} ${top disk 6} ${top gpu 6} ${top net 6}
${color lightgrey}${top name 7} ${top pid 7} ${top cpu 7} ${top mem 7} ${top disk 7} ${top gpu 7} ${top net 7}
${color lightgrey}${top name 8} ${top pid 8} ${top cpu 8} ${top mem 8} ${top disk 8} ${top gpu 8} ${top net 8}
${color lightgrey}${top name 9} ${top pid 9} ${top cpu 9} ${top mem 9} ${top disk 9} ${top gpu 9} ${top net 9}
${color lightgrey}${top name 10} ${top pid 10} ${top cpu 10} ${top mem 10} ${top disk 10} ${top gpu 10} ${top net 10}
]]