name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DeskMeter.sln

      - name: Build (Release)
        run: dotnet build DeskMeter.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/DeskMeter.Tests/DeskMeter.Tests.csproj -c Release --no-build
