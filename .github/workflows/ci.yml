name: CI

# 只在 PR 时运行构建+测试（用户决策：dev/main 日常推送不触发任何流水线；
# 发布只由 v* 标签触发，见 release.yml）
on:
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DeskMeter.sln

      - name: Build (Release)
        run: dotnet build DeskMeter.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/DeskMeter.Tests/DeskMeter.Tests.csproj -c Release --no-build
